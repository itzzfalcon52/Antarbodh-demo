# =============================================================================
# ANTARBODH — Prototype Configuration
# =============================================================================
# AI-powered reconstruction of subsurface ocean temperature from surface
# satellite and reanalysis observations.
#
# This file is the SINGLE SOURCE OF TRUTH for all preprocessing parameters.
# Python code consumes these values; it does NOT silently override them.
# =============================================================================

project:
  name: "ANTARBODH"
  description: "AI-powered subsurface ocean temperature reconstruction"

# =============================================================================
# SPATIAL DOMAIN
# =============================================================================
# Values are DOMAIN EDGES, not cell centers.
# Cell centers are computed as:  edge + resolution/2  →  edge - resolution/2
# For the prototype:
#   latitude centers:  5.125, 5.375, ..., 19.875  (60 cells)
#   longitude centers: 80.125, 80.375, ..., 99.875 (80 cells)
region:
  min_lat: 5.0
  max_lat: 20.0
  min_lon: 80.0
  max_lon: 100.0

  # Final SIH project domain (not active):
  # min_lat: 5
  # max_lat: 30
  # min_lon: 45
  # max_lon: 105

# =============================================================================
# TEMPORAL RANGE & CHRONOLOGICAL SPLIT
# =============================================================================
time:
  start: "2020-01-01"
  end: "2025-12-31"

split:
  train_end_year: 2023      # Train: 2020-01-01 → 2023-12-31
  val_year: 2024             # Val:   2024-01-01 → 2024-12-31
  test_year: 2025            # Test:  2025-01-01 → 2025-12-31

# =============================================================================
# TARGET GRID
# =============================================================================
target_grid:
  resolution: 0.25           # degrees, used for both lat and lon

# =============================================================================
# TARGET DEPTHS (meters)
# =============================================================================
# NOTE: GLORYS native shallowest depth is ~0.494 m. The 0 m level is
# represented using this shallowest native level as a surface proxy.
# This is documented but does NOT represent an exact 0 m observation.
target_depths:
  - 0
  - 5
  - 10
  - 20
  - 30
  - 50
  - 75
  - 100
  - 125
  - 150
  - 200
  - 300
  - 500
  - 700
  - 1000

# =============================================================================
# SOURCE DATA FILES
# =============================================================================
# Explicit filenames for each dataset. The pipeline selects EXACTLY these files.
# No file-size-based selection. No ambiguous glob matching.
data_sources:
  glorys:
    directory: "data/raw/glorys"
    filename: "glorys_bob_(2).nc"
    expected_variable: "thetao"
    product_level: "reanalysis"
    product_id: "cmems_mod_glo_phy_my_0.083deg_P1D-m"

  sst:
    directory: "data/raw/sst"
    filename: "sst_bob.nc"
    expected_variable: "analysed_sst"
    product_level: "L4"
    product_id: "METOFFICE-GLO-SST-L4-REP-OBS-SST"
    units_conversion: "kelvin_to_celsius"

  sss:
    directory: "data/raw/sss"
    filename: "sss_bob_full.nc"
    expected_variable: "sos"
    product_level: "L4"
    product_id: "cmems_obs-mob_glo_phy-sss_my_multi_P1D (MY+NRT combined)"
    # LIMITATION: MY product ends 2024-12-15. Combined with NRT product
    # covering 2024-12-16 to present to ensure full coverage across Train/Val/Test.
    legacy_ascending: "sss_bob_ascending_(2).nc"
    legacy_descending: "sss_bob_descending_(2).nc"
    legacy_variable: "Sea_Surface_Salinity"

  ssh:
    directory: "data/raw/ssh"
    filename: "ssh_bob_(2).nc"
    expected_variable: "sla"
    product_level: "L4"
    product_id: "c3s_obs-sl_glo_phy-ssh_my_twosat-l4-duacs-0.25deg_P1D"

  currents:
    directory: "data/raw/currents"
    filename: "currents_bob_(2).nc"
    expected_variables:
      - "uo"
      - "vo"
    product_level: "L4"
    product_id: "cmems_obs-mob_glo_phy-cur_my_0.25deg_P1D-m"

  winds:
    directory: "data/raw/winds"
    filename: "winds_bob.nc"
    expected_variables:
      - "eastward_wind"
      - "northward_wind"
    product_level: "L4"
    product_id: "cmems_obs-wind_glo_phy_my_l4_0.125deg_PT1H"
    temporal_resolution: "hourly"

# =============================================================================
# QUALITY CONTROL THRESHOLDS
# =============================================================================
# These are prototype-specific QC bounds. Values outside these ranges are
# set to NaN (masked). Each threshold is documented with its rationale.
qc_thresholds:
  sst:
    min: -2.0      # Approximate freezing point of seawater
    max: 40.0      # Upper bound for tropical/subtropical SST
    units: "degrees_C"

  sss:
    min: 0.0       # Freshwater minimum
    max: 38.0      # Dataset-specific anomaly filter.
    # RATIONALE: The SSS ≤ 38 bound is a CONSERVATIVE dataset-specific
    # QC filter, NOT a universal physical oceanographic law. It is intended
    # to remove the previously observed anomalous high-salinity population
    # near 61–62 PSU in the raw SSS product. Open-ocean salinity rarely
    # exceeds 37 PSU in the Bay of Bengal.
    units: "PSU (practical salinity, source numeric convention 0.001)"

  ssh:
    min: -5.0      # Conservative SLA bounds
    max: 5.0
    units: "m"

  currents:
    min: -5.0      # Conservative surface current bounds
    max: 5.0
    units: "m/s"

  winds:
    min: -50.0     # Conservative wind speed bounds
    max: 50.0
    units: "m/s"

  thetao:
    min: -2.0      # Approximate freezing point of seawater
    max: 40.0      # Upper bound for deep + tropical temperatures
    units: "degrees_C"

# =============================================================================
# WIND HOURLY-TO-DAILY RESAMPLING
# =============================================================================
# Minimum number of valid hourly observations required to produce a valid
# daily mean. Days with fewer valid hours are set to NaN.
# Default: 18 of 24 hours (75% coverage requirement).
# Rationale: Ensures daily wind means are representative. A single valid
# hour should not be enough to declare the entire day "observed."
wind_min_hourly_obs_per_day: 18

# =============================================================================
# PROCESSING PARAMETERS
# =============================================================================
processing:
  interpolation_method: "linear"
  dask_workers: 4
  compression_level: 4

# =============================================================================
# INPUT CHANNELS (7 physical + 7 validity masks = 14 total)
# =============================================================================
# Channel order is deterministic and must match this specification.
input_channels:
  physical:
    - "SST"
    - "SSS"
    - "SSH"
    - "Current_U"
    - "Current_V"
    - "Wind_U"
    - "Wind_V"
  masks:
    - "SST_mask"
    - "SSS_mask"
    - "SSH_mask"
    - "Current_U_mask"
    - "Current_V_mask"
    - "Wind_U_mask"
    - "Wind_V_mask"

# =============================================================================
# OUTPUT
# =============================================================================
output:
  target_variable: "thetao"
  target_units: "degrees_C"
  target_depths: 15
  representation:
    inputs: "X[time, channel, latitude, longitude]"
    targets: "Y[time, depth, latitude, longitude]"

# =============================================================================
# ARGO (independent validation — NOT a model input)
# =============================================================================
argo:
  role: "independent_validation"
  output_directory: "data/raw/argo"

incois_argo:
  role: "independent_validation"
  output_directory: "data/raw/argo/incois"