

project:
  name: "ANTARBODH"
  description: "AI-powered subsurface ocean temperature reconstruction"



region:
  # Initial Bay of Bengal prototype
  min_lat: 5
  max_lat: 20
  min_lon: 80
  max_lon: 100

  # Final project domain:
  # min_lat: 5
  # max_lat: 30
  # min_lon: 45
  # max_lon: 105




time:
  start: "2020-01-01"
  end: "2025-12-31"

  # Initial testing:
  # start: "2020-01-01"
  # end: "2020-01-03"

 


target_grid:
  resolution_lat: 0.25
  resolution_lon: 0.25

  # Final target representation:
  # X[time, latitude, longitude, channel]
  # Y[time, depth, latitude, longitude]


target_depths:
  - 0
  - 5
  - 10
  - 20
  - 30
  - 50
  - 75
  - 100
  - 125
  - 150
  - 200
  - 300
  - 500
  - 700
  - 1000



glorys:
  dataset_id: "cmems_mod_glo_phy_my_0.083deg_P1D-m"

  variables:
    - "thetao"

  min_depth: 0
  max_depth: 1100

  output_filename: "glorys_bob"

  output_directory: "data/raw/glorys"

  # GLORYS native resolution is ~1/12 degree.
  # It will later be regridded to 0.25 degrees.



sst:
  product_id: "SST_GLO_SST_L4_REP_OBSERVATIONS_010_011"
  dataset_id: "METOFFICE-GLO-SST-L4-REP-OBS-SST"
  variables:
    - "analysed_sst"
  output_filename: "sst_bob"
  output_directory: "data/raw/sst"
  temporal_resolution: "daily"
  native_resolution: 0.05

sss:
  product_id: "MULTIOBS_GLO_PHY_S_SURFACE_MYNRT_015_013"
  dataset_id: "cmems_obs-mob_glo_phy-sss_my_multi_P1D"
  variables:
    - "sos"
  output_filename: "sss_bob"
  output_directory: "data/raw/sss"
  temporal_resolution: "daily"
  native_resolution: 0.25




ssh:
  product_id: "SEALEVEL_GLO_PHY_CLIMATE_L4_MY_008_057"

  dataset_id: "c3s_obs-sl_glo_phy-ssh_my_twosat-l4-duacs-0.25deg_P1D"

  # Confirm exact variable name with:
  # copernicusmarine describe
  variables:
    - "sla"

  output_filename: "ssh_bob"

  output_directory: "data/raw/ssh"

  temporal_resolution: "daily"

  native_resolution: 0.25




currents:
  product_id: "MULTIOBS_GLO_PHY_MYNRT_015_003"

  dataset_id: "cmems_obs-mob_glo_phy-cur_my_0.25deg_P1D-m"

  variables:
    - "uo"
    - "vo"

  output_filename: "currents_bob"

  output_directory: "data/raw/currents"

  temporal_resolution: "daily"

  native_resolution: 0.25

  # Surface-current fields are used.
  # Confirm exact depth/surface coordinate through describe.


winds:
  product_id: "WIND_GLO_PHY_L4_MY_012_006"
  dataset_id: "cmems_obs-wind_glo_phy_my_l4_0.125deg_PT1H"
  variables:
    - "eastward_wind"
    - "northward_wind"
  output_filename: "winds_bob"
  output_directory: "data/raw/winds"
  temporal_resolution: "hourly"
  target_resolution: 0.25



argo:
  role: "independent_validation"

  output_directory: "data/raw/argo"

  target_depths:
    - 0
    - 5
    - 10
    - 20
    - 30
    - 50
    - 75
    - 100
    - 125
    - 150
    - 200
    - 300
    - 500
    - 700
    - 1000




incois_argo:
  role: "independent_validation"

  output_directory: "data/raw/argo/incois"



download:
  file_format: "netcdf"

  compression_level: 4

  # Prototype mode
  dry_run: false

  # Prevent accidental overwriting
  overwrite: false


preprocessing:
  target_lat_resolution: 0.25
  target_lon_resolution: 0.25

  interpolation_method: "linear"

  temporal_frequency: "1D"

  handle_missing_values: true

  normalize_inputs: true


input_channels:
  - "sst"
  - "sss"
  - "ssh"
  - "current_u"
  - "current_v"
  - "wind_u"
  - "wind_v"




output:
  target_variable: "thetao"

  target_depths: 15

  representation:
    inputs: "X[time, latitude, longitude, channel]"
    targets: "Y[time, depth, latitude, longitude]"